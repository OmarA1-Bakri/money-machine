[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "money-machine"
version = "0.1.0"
description = "Foundation for the Money Machine modular monolith"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "fastapi>=0.116,<1",
  "notion-client>=2.2,<3",
  "pydantic>=2.11,<3",
  "pyyaml>=6.0.2,<7",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
money-machine = "money_machine.cli.main:main"
money-machine-control = "money_machine.control.cli:main"

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest-asyncio>=0.25,<2",
  "pyright>=1.1.403,<2",
  "pytest>=8.4,<9",
  "respx>=0.21,<1",
  "ruff>=0.12,<1",
  "types-pyyaml>=6.0.12.20250516,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/money_machine"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --import-mode=importlib"
consider_namespace_packages = true
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.pyright]
include = ["src", "tests", "migrations/env.py"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownParameterType = "none"
reportUnknownArgumentType = "none"
reportMissingParameterType = "none"
reportCallIssue = "none"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".omx", ".opencode", ".agents", ".claude", ".token-optimizer", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Alembic revisions are generated artefacts reviewed as SQL, not hand-formatted Python.
# Wrapping the emitted constraint strings would change the SQL they contain.
"migrations/versions/*.py" = ["E501"]
