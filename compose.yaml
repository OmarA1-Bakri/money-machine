name: money-machine

x-database-environment: &database-environment
  POSTGRES_DB: ${POSTGRES_DB:-money_machine}
  POSTGRES_USER: ${POSTGRES_USER:-money_machine}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_development_only}
  DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-money_machine}@postgres:5432/${POSTGRES_DB:-money_machine}}
  DATABASE_PASSWORD: ${DATABASE_PASSWORD:-}
  DATABASE_PASSWORD_FALLBACK: ${POSTGRES_PASSWORD:-local_development_only}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      <<: *database-environment
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      <<: *database-environment
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        # Liveness, deliberately: readiness fails until migrations are applied, so a
        # readiness probe here would keep a fresh stack permanently unhealthy. The
        # operator and any orchestrator use /readiness.
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # The worker is registered but not commissioned. It performs a read-only database
  # connectivity check, logs the result, and exits 78 without claiming any job. The exit
  # is terminal on purpose, so `restart: "no"` and no healthcheck: a health probe would
  # imply a long-running process. Job claiming is commissioned in Session 03.
  worker:
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    environment:
      <<: *database-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # The scheduler is registered but not commissioned, on the same contract as the worker.
  scheduler:
    build:
      context: .
      dockerfile: infra/docker/scheduler.Dockerfile
    environment:
      <<: *database-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  postgres-data:
