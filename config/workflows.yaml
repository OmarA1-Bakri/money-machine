version: 1
workflows:
  - workflow_id: first-product
    external_mutations_enabled: false
    spend_enabled: false
    steps:
      - job_type: ADMIT_RESEARCH_PACKET
        role_id: market_research
        retry_class: TRANSIENT_PROVIDER_READ
      - job_type: QUALIFY_CANDIDATES
        role_id: market_research
        retry_class: NEVER
      - job_type: CREATE_PRODUCT_SPEC
        role_id: product_strategy
        retry_class: NEVER
      - job_type: CHECK_CATALOGUE_DEDUPE
        role_id: catalogue_dedupe
        retry_class: NEVER
      - job_type: BUILD_PRODUCT
        role_id: notion_product_builder
        retry_class: TRANSIENT_INTERNAL
      - job_type: RUN_PRODUCT_QA
        role_id: product_qa
        retry_class: NEVER
      - job_type: CREATE_LISTING_PACKAGE
        role_id: merchandising
        retry_class: TRANSIENT_INTERNAL
      - job_type: RUN_PREFLIGHT
        role_id: preflight
        retry_class: NEVER
