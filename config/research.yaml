version: 1
research:
  # Seed phrases from playbook for initial market research
  seed_phrases:
    - budget planner
    - teacher appreciation
    - mindfulness journal
    - workout tracker
    - habit tracker
    - gratitude journal
    - desk organizer
    - password organizer
    - productivity planner
    - mood tracker

  # Research collection parameters
  target_observation_count: 30  # Target 25-40, aim for middle
  max_results_per_query: 50
  
  # Young-and-fast shop criteria
  young_shop_age_days: 365  # Less than 12 months
  fast_shop_sales_threshold: 400  # At least 400 sales
  
  # Shortlist analysis parameters
  shortlist_size: 5
  min_observations_per_candidate: 3
  
  # Source policy
  source_policy_version: "v1.0"
