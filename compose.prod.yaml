name: money-machine-prod

x-database-environment: &database-environment
  POSTGRES_DB: ${POSTGRES_DB:-money_machine}
  POSTGRES_USER: ${POSTGRES_USER:-money_machine}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-money_machine}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-money_machine}

x-python-service: &python-service
  build:
    context: .
    dockerfile: Dockerfile
  environment:
    <<: *database-environment
    EXTERNAL_ACTIONS_ENABLED: "false"
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      <<: *database-environment
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s
    restart: unless-stopped

  api:
    <<: *python-service
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      API_BASE_URL: http://api:8000
      EXTERNAL_ACTIONS_ENABLED: "false"
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  worker:
    <<: *python-service
    command: ["python", "-m", "money_machine.orchestration.worker"]
    restart: "no"

  scheduler:
    <<: *python-service
    command: ["python", "-m", "money_machine.orchestration.scheduler"]
    restart: "no"

volumes:
  postgres-data:
