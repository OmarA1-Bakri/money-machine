name: End-to-end safety gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  uncommissioned:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/verify_scaffold.py
      - name: Refuse uncommissioned end-to-end execution
        run: bash scripts/e2e.sh
